# config/docker-compose.yml
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: todo_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: todo_manager
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: todo_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - todo_network

  backend:
    build: ../backend
    container_name: todo_backend
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    environment:
      - DATABASE_URL=mysql://todo_user:todo_password@mysql:3306/todo_manager
    volumes:
      - ../backend:/app
    networks:
      - todo_network

  frontend:
    build: ../frontend
    container_name: todo_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - todo_network

volumes:
  mysql_data:

networks:
  todo_network:
    driver: bridge